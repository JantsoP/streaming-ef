# =============================================================================
# LOCAL DEVELOPMENT COMPOSE FILE
# =============================================================================
# Use this file for local development — NOT for production.
#
#   sail -f docker-compose.local.yml up -d
#
# Or set it permanently in your shell:
#   export COMPOSE_FILE=docker-compose.local.yml
#   sail up -d
#
# See LOCAL_DEV.md for a full step-by-step guide.
# =============================================================================

services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            # Shared with origin-ffmpeg-hls so the VOD job can read archive segments
            - hls-content:/var/www/hls
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - minio

    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    soketi:
        image: 'quay.io/soketi/soketi:latest-16-alpine'
        ports:
            - '${SOKETI_PORT:-6001}:6001'
            - '${SOKETI_METRICS_SERVER_PORT:-9601}:9601'
        environment:
            SOKETI_DEBUG: '${SOKETI_DEBUG:-0}'
            SOKETI_METRICS_SERVER_PORT: '9601'
            SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID}'
            SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY}'
            SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET}'
        networks:
            - sail

    # Local S3-compatible object storage — replaces real S3/Hetzner for DVR testing
    minio:
        image: 'minio/minio:latest'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'       # S3 API
            - '${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001' # Web console
        environment:
            MINIO_ROOT_USER:     '${DVR_AWS_ACCESS_KEY_ID:-minio}'
            MINIO_ROOT_PASSWORD: '${DVR_AWS_SECRET_ACCESS_KEY:-minio123}'
        volumes:
            - 'minio-data:/data'
        networks:
            - sail
        command: 'server /data --console-address ":9001"'
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 10s
            retries: 3
            timeout: 5s

    # SRS Origin — RTMP ingest + DVR recording
    origin-srs:
        image: ossrs/srs:6
        ports:
            - '${FORWARD_SRS_RTMP_PORT:-1935}:1935'
            - '${FORWARD_SRS_HTTP_PORT:-8082}:8082'
            - '${FORWARD_SRS_API_PORT:-1985}:1985'
        environment:
            SRS_HTTP_PORT: 8082
        networks:
            - sail
        volumes:
            - ./docker/origin-srs/origin.conf:/usr/local/srs/conf/custom.conf:ro
            - dvr-recordings:/dvr/recordings
        command: ./objs/srs -c /usr/local/srs/conf/custom.conf
        depends_on:
            - laravel.test
        restart: unless-stopped

    # FFmpeg HLS transcoder — converts RTMP → multi-bitrate HLS
    origin-ffmpeg-hls:
        build:
            context: ./docker/ffmpeg-hls
            dockerfile: Dockerfile
        environment:
            SRS_API_URL:     'http://origin-srs:1985/api/v1'
            SRS_RTMP_URL:    'rtmp://origin-srs:1935'
            OUTPUT_BASE_DIR: /var/www/hls/live
            ARCHIVE_BASE_DIR: /var/www/hls/archive
            ARCHIVE_FLAGS_DIR: /var/www/hls/archive-flags
            ARCHIVE_PAUSE_DIR: /var/www/hls/archive-pause
            CHECK_INTERVAL:  5
        volumes:
            - hls-content:/var/www/hls
        networks:
            - sail
        depends_on:
            - origin-srs
        restart: unless-stopped

    # Origin Nginx — serves HLS with auth_request
    origin-nginx:
        image: nginx:alpine
        ports:
            - '${FORWARD_ORIGIN_NGINX_PORT:-8083}:8083'
        volumes:
            - ./docker/origin-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - hls-content:/var/www/hls:ro
            - origin-nginx-logs:/var/log/nginx
        networks:
            - sail
        depends_on:
            - laravel.test
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/health"]
            interval: 10s
            timeout: 5s
            retries: 3
        restart: unless-stopped

    # Origin Caddy — HTTP(S) front for HLS origin
    origin-caddy:
        image: caddy:alpine
        ports:
            - '${FORWARD_ORIGIN_CADDY_PORT:-8070}:8070'
        environment:
            DOMAIN:            '${APP_URL:-localhost}'
            CADDY_PORT:        8070
            NGINX_ORIGIN_PORT: 8083
        volumes:
            - ./docker/origin-caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - origin-caddy-data:/data
            - origin-caddy-config:/config
            - origin-caddy-logs:/var/log/caddy
        networks:
            - sail
        depends_on:
            - origin-nginx
        restart: unless-stopped

    # DVR uploader — watches /dvr/recordings and uploads SRS .mp4 segments to MinIO
    dvr-uploader:
        build:
            context: ./docker/dvr-uploader
            dockerfile: Dockerfile
        environment:
            S3_BUCKET:            '${DVR_AWS_BUCKET:-recording}'
            S3_REGION:            '${DVR_AWS_DEFAULT_REGION:-us-east-1}'
            S3_ACCESS_KEY:        '${DVR_AWS_ACCESS_KEY_ID:-minio}'
            S3_SECRET_KEY:        '${DVR_AWS_SECRET_ACCESS_KEY:-minio123}'
            S3_ENDPOINT:          '${DVR_AWS_ENDPOINT:-http://minio:9000}'
            RECORDINGS_PATH:      /dvr/recordings
            DELETE_AFTER_UPLOAD:  'false'   # keep segments locally for easier debugging
            WEBHOOK_URL:          'http://laravel.test/api/dvr/upload-webhook'
            FILE_AGE_SECONDS:     '30'
            UPLOAD_DELAY_SECONDS: '5'
            MAX_UPLOAD_RATE_MBPS: '50'      # no real network throttle needed locally
        volumes:
            - dvr-recordings:/dvr/recordings
        networks:
            - sail
        depends_on:
            - origin-srs
            - laravel.test
            - minio
        restart: unless-stopped

    # Edge Nginx — caches and proxies HLS from Origin Caddy
    edge-nginx:
        image: nginx:alpine
        ports:
            - '${FORWARD_EDGE_NGINX_PORT:-8081}:8081'
        volumes:
            - ./docker/edge-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - edge-nginx-logs:/var/log/nginx
            - edge-nginx-cache:/var/cache/nginx
        networks:
            - sail
        depends_on:
            - laravel.test
            - origin-caddy
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
            interval: 10s
            timeout: 5s
            retries: 3
        restart: unless-stopped

    # Edge Caddy — SSL/HTTP front for edge HLS delivery (port 8085 = player default)
    edge-caddy:
        image: caddy:alpine
        ports:
            - '${FORWARD_EDGE_CADDY_PORT:-8085}:8085'
        environment:
            DOMAIN:          '${APP_URL:-localhost}'
            CADDY_PORT:      8085
            NGINX_EDGE_PORT: 8081
        volumes:
            - ./docker/edge-caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
            - caddy-logs:/var/log/caddy
        networks:
            - sail
        restart: unless-stopped

volumes:
    sail-mysql:       { driver: local }
    sail-redis:       { driver: local }
    minio-data:       { driver: local }
    hls-content:      { driver: local }
    dvr-recordings:   { driver: local }
    origin-nginx-logs: { driver: local }
    origin-caddy-data: { driver: local }
    origin-caddy-config: { driver: local }
    origin-caddy-logs: { driver: local }
    edge-nginx-logs:  { driver: local }
    edge-nginx-cache: { driver: local }
    caddy-data:       { driver: local }
    caddy-config:     { driver: local }
    caddy-logs:       { driver: local }

networks:
    sail:
        driver: bridge
