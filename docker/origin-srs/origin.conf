# SRS Origin Server Configuration
# Simple passthrough - no transcoding, no HLS
# FFmpeg container handles HLS ABR generation with perfect GOP alignment

listen              1935;
max_connections     300;
server_id           71;

srs_log_tank        console;
daemon              off;

# SRT ingest server — an alternative to RTMP for OBS/vMix operators.
# Runs alongside RTMP on a separate UDP port (10080).
# SRS bridges SRT to the same internal RTMP stream so stream-manager.sh,
# auth webhooks, and all downstream logic are completely unchanged.
#
# OBS stream settings for SRT:
#   Service:    Custom
#   Server:     srt://<host>:10080
#   Stream Key: #!::r=live/<your-stream-key>,m=publish
#
# Benefits over RTMP:
#   • ~120 ms end-to-end latency vs 2-4 s for RTMP
#   • Built-in ARQ retransmission: tolerates 10-30 % packet loss without stuttering
#   • Better for remote/wireless contributors; RTMP still works for wired on-site
srt_server {
    enabled         on;
    listen          10080;
    maxbw           1000000000;
    connect_timeout 4000;
    # Negotiated latency in ms. 120 ms is a safe default for LAN/venue use.
    # Lower to 60-80 ms on a reliable wired connection; raise to 200-500 ms
    # for remote contributors over the internet.
    latency         120;
}

# HTTP API for stream monitoring
http_api {
    enabled         on;
    listen          1985;
}

# HTTP server for stats/debugging (not for HLS)
http_server {
    enabled         on;
    listen          8082;
    dir             ./objs/nginx/html;
}

# Disable RTC
rtc_server {
    enabled         off;
}

# Main vhost - simple passthrough
vhost __defaultVhost__ {
    # Webhook authentication for publishing
    # NOTE: must use the Docker service name (laravel.test), NOT 127.0.0.1.
    # Inside the SRS container, 127.0.0.1 is the container itself.
    http_hooks {
        enabled         on;
        on_publish      http://laravel.test/api/srs/auth;
        on_unpublish    http://laravel.test/api/srs/unpublish;
        on_dvr          http://laravel.test/api/srs/dvr;
    }

    # DVR configuration for recording streams
    dvr {
        enabled             off;
        # Apply to all streams
        dvr_apply           all;
        # Use segment plan to split files
        dvr_plan            segment;
        # Path with stream-based organization and timestamp
        # Creates: /dvr/recordings/[app]/[stream]/[2006]-[01]-[02]/[15]-[04]-[05]_[timestamp].mp4
        dvr_path            /dvr/recordings/[app]/[stream]/[2006]-[01]-[02]/[15]-[04]-[05]_[timestamp].mp4;
        # 10 minutes per segment (600 seconds)
        dvr_duration        600;
        # Wait for keyframe before splitting
        dvr_wait_keyframe   on;
        # Full time jitter handling for proper timestamps
        time_jitter         full;
    }

    # No HLS - FFmpeg handles this
    hls {
        enabled         off;
    }

    # No transcoding - FFmpeg handles this
    transcode {
        enabled         off;
    }

    # Keep GOP cache for lower latency on playback start
    play {
        gop_cache       on;
        mw_latency      350;
    }

    # No HTTP remux
    http_remux {
        enabled         off;
    }
}
